server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/html/orchestrator;
    index build_report.html;

    location / {
        try_files $uri $uri/ =404;
    }

    # Manual trigger API (orchestrator-api.service), local-only backend.
    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
